
name: Bootstrap DSHA Agent MCP Hub

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract starter files
        run: |
          test -f dsha-agent-starter.zip
          unzip -o dsha-agent-starter.zip -d /tmp/dsha-agent-starter
          cp -a /tmp/dsha-agent-starter/. .
          rm -f dsha-agent-starter.zip

      - name: Commit starter files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bootstrap DSHA Agent MCP Hub"
          git push
